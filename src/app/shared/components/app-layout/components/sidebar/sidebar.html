<header class="sidebar" aria-label="Main navigation">
  <a class="brand" routerLink="/" aria-label="Visual DSA home" (click)="closeGroups()">
    <span class="brand-mark"><i class="pi pi-sitemap" aria-hidden="true"></i></span>
    <span class="brand-copy"><strong>visual<span>dsa</span></strong><small>LEARNING STUDIO</small></span>
  </a>

  <nav class="sidebar-scroll" aria-label="Learning library">
    <a
      class="nav-link overview-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeGroups()"
    >
      <i class="pi pi-home" aria-hidden="true"></i><span>Overview</span>
    </a>

    @for (group of navigation; track group.id) {
      <section class="nav-group" [class.group-open]="isExpanded(group.id)">
        <button
          class="nav-link group-toggle"
          type="button"
          [attr.aria-expanded]="isExpanded(group.id)"
          [attr.aria-controls]="'nav-' + group.id"
          (click)="toggleGroup(group.id)"
        >
          <i [class]="'pi ' + group.icon" aria-hidden="true"></i>
          <span>{{ group.label }}</span>
          <i class="pi pi-chevron-down group-chevron" aria-hidden="true"></i>
        </button>
        @if (isExpanded(group.id)) {
          <div class="nav-children" [id]="'nav-' + group.id">
            @for (subgroup of group.subgroups; track subgroup.id) {
              <section class="nav-subgroup">
                <p class="subgroup-label">{{ subgroup.label }}</p>
                @for (page of subgroup.pages; track page.path) {
                  <a
                    class="child-link"
                    [routerLink]="page.path"
                    routerLinkActive="active"
                    [title]="page.label"
                    (click)="closeGroups()"
                  >
                    <span class="child-marker"></span><span>{{ page.label }}</span>
                  </a>
                }
              </section>
            }
          </div>
        }
      </section>
    }
  </nav>

</header>
